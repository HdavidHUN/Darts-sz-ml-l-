
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Darts Számláló (501 / 301)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .players-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .player-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        .player-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-card.active .player-name {
            color: var(--accent);
        }

        .player-score {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .player-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .checkout-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .checkout-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .checkout-route {
            font-size: 0.95rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .key {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            padding: 16px 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .key:active {
            background-color: var(--border);
        }

        .key.action {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
            font-size: 1rem;
        }

        .key.submit {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            grid-column: span 2;
            font-size: 1.1rem;
        }

        /* Modális ablakok */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-size: 1rem;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">501 DO</h1>
        <div>
            <button class="icon-btn" onclick="openSettings()" title="Beállítások">⚙️</button>
            <button class="icon-btn" onclick="resetMatch()" title="Új meccs">🔄</button>
        </div>
    </header>

    <div class="players-container">
        <div class="player-card active" id="card-0" onclick="renamePlayer(0)">
            <div class="player-name" id="name-0">1. Játékos</div>
            <div class="player-score" id="score-0">501</div>
            <div class="player-stats">Átlag: <span id="avg-0">0.0</span></div>
        </div>
        <div class="player-card" id="card-1" onclick="renamePlayer(1)">
            <div class="player-name" id="name-1">2. Játékos</div>
            <div class="player-score" id="score-1">501</div>
            <div class="player-stats">Átlag: <span id="avg-1">0.0</span></div>
        </div>
    </div>

    <div class="checkout-box">
        <div class="checkout-label">Kiszálló javaslat</div>
        <div class="checkout-route" id="checkout-text">-</div>
    </div>

    <div class="keypad">
        <button class="key" onclick="pressNum('7')">7</button>
        <button class="key" onclick="pressNum('8')">8</button>
        <button class="key" onclick="pressNum('9')">9</button>
        <button class="key action" onclick="clearInput()">C</button>

        <button class="key" onclick="pressNum('4')">4</button>
        <button class="key" onclick="pressNum('5')">5</button>
        <button class="key" onclick="pressNum('6')">6</button>
        <button class="key action" onclick="undoScore()">↩</button>

        <button class="key" onclick="pressNum('1')">1</button>
        <button class="key" onclick="pressNum('2')">2</button>
        <button class="key" onclick="pressNum('3')">3</button>
        <button class="key" style="grid-row: span 2; font-size: 1rem; color: #38bdf8;" onclick="pressNum('0')">0</button>

        <button class="key" onclick="pressNum('26')">26</button>
        <button class="key" onclick="pressNum('41')">41</button>
        <button class="key" onclick="pressNum('45')">45</button>
        
        <button class="key submit" onclick="submitScore()">Küldés (<span id="input-display">0</span>)</button>
    </div>

    <!-- Beállítások Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3>Játék beállítások</h3>
            <div class="form-group">
                <label>Kezdő pontszám</label>
                <select id="setting-startscore">
                    <option value="501">501</option>
                    <option value="301">301</option>
                </select>
            </div>
            <div class="form-group">
                <label>Kiszállási szabály</label>
                <select id="setting-checkout">
                    <option value="DO">Dupla kiszálló (DO)</option>
                    <option value="SO">Bármi (SO)</option>
                </select>
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeSettings()">Mégse</button>
                <button class="btn btn-primary" onclick="saveSettings()">Mentés</button>
            </div>
        </div>
    </div>

    <script>
        const checkouts = {
            170: "T20 T20 D25", 167: "T20 T19 D25", 164: "T20 T18 D25", 161: "T20 T17 D25", 160: "T20 T20 D20",
            158: "T20 T20 D19", 157: "T20 T19 D20", 156: "T20 T20 D18", 155: "T20 T19 D19", 154: "T20 T18 D20",
            153: "T20 T19 D18", 152: "T20 T20 D16", 151: "T20 T17 D20", 150: "T20 T18 D18", 149: "T20 T19 D16",
            148: "T20 T16 D20", 147: "T20 T17 D18", 146: "T20 T18 D16", 145: "T20 T15 D20", 144: "T20 T20 D12",
            143: "T20 T17 D16", 142: "T20 T14 D20", 141: "T20 T19 D12", 140: "T20 T20 D10", 139: "T20 T13 D20",
            138: "T20 T18 D12", 137: "T20 T15 D16", 136: "T20 T20 D8",  135: "T20 T15 D15", 134: "T20 T14 D16",
            133: "T20 T19 D8",  132: "T20 T16 D12", 131: "T20 T13 D16", 130: "T20 T20 D5",  129: "T19 T16 D12",
            128: "T18 T14 D16", 127: "T20 T17 D8",  126: "T19 T19 D6",  125: "T20 T15 D10", 124: "T20 T14 D11",
            123: "T19 T16 D10", 122: "T18 T18 D7",  121: "T20 T15 D8",  120: "T20 20 D20",   119: "T19 T12 D16",
            118: "T20 18 D20",   117: "T20 17 D20",   116: "T20 16 D20",   115: "T20 15 D20",   114: "T20 14 D20",
            113: "T20 13 D20",   112: "T20 12 D20",   111: "T20 11 D20",   110: "T20 10 D20",   109: "T20 9 D20",
            108: "T20 8 D20",    107: "T19 10 D20",   106: "T20 10 D18",   105: "T20 13 D16",   104: "T18 10 D20",
            103: "T13 10 D20",   102: "T20 10 D16",   101: "T17 10 D20",   100: "T20 D20",      99: "T19 10 D16",
            98: "T20 D19",       97: "T19 D20",       96: "T20 D18",       95: "T19 D18",       94: "T18 D20",
            93: "T19 D18",       92: "T20 D16",       91: "T17 D20",       90: "T18 D18",       89: "T19 D16",
            88: "T16 D20",       87: "T17 D18",       86: "T18 D16",       85: "T15 D20",       84: "T20 D12",
            83: "T17 D16",       82: "T14 D20",       81: "T19 D12",       80: "T20 D10",       79: "T13 D20",
            78: "T18 D12",       77: "T15 D16",       76: "T20 D8",        75: "T17 D12",       74: "T14 D16",
            73: "T19 D8",        72: "T16 D12",       71: "T13 D16",       70: "T18 D8",        69: "T15 D12",
            68: "T20 D4",        67: "T17 D8",        66: "T10 D18",       65: "T15 D10",       64: "T16 D8",
            63: "T13 D12",       62: "T10 D16",       61: "T15 D8",        60: "20 D20",        59: "19 D20",
            58: "18 D20",        57: "17 D20",        56: "16 D20",        55: "15 D20",        54: "14 D20",
            53: "13 D20",        52: "12 D20",        51: "11 D20",        50: "10 D20",        49: "9 D20",
            48: "16 D16",        47: "7 D20",         46: "6 D20",         45: "13 D16",        44: "12 D16",
            43: "3 D20",         42: "10 D16",        41: "9 D16",         40: "D20",           39: "7 D16",
            38: "D19",           37: "5 D16",         36: "D18",           35: "3 D16",         34: "D17",
            33: "1 D16",         32: "D16",           31: "15 D8",         30: "D15",           29: "13 D8",
            28: "D14",           27: "11 D8",         26: "D13",           25: "9 D8",          24: "D12",
            23: "7 D8",          22: "D11",           21: "5 D8",          20: "D10",           19: "3 D8",
            18: "D9",            17: "1 D8",          16: "D8",            15: "7 D4",          14: "D7",
            13: "5 D4",          12: "D6",            11: "3 D4",          10: "D5",             9: "1 D4",
            8: "D4",             7: "3 D2",           6: "D3",             5: "1 D2",           4: "D2",
            3: "1 D1",           2: "D1"
        };

        let state = {
            scores: [501, 501],
            names: ["1. Játékos", "2. Játékos"],
            activePlayer: 0,
            inputBuffer: "",
            startScore: 501,
            checkoutType: "DO",
            history: [],
            stats: [{ darts: 0, totalScore: 0 }, { darts: 0, totalScore: 0 }]
        };

        function init() {
            const saved = localStorage.getItem('darts_state_v1');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            }
            updateUI();
        }

        function saveState() {
            localStorage.setItem('darts_state_v1', JSON.stringify(state));
        }

        function pressNum(numStr) {
            if (numStr === '0' && state.inputBuffer === '') return;
            state.inputBuffer += numStr;
            const val = parseInt(state.inputBuffer);
            if (val > 180) {
                state.inputBuffer = '180';
            }
            document.getElementById('input-display').innerText = state.inputBuffer;
        }

        function clearInput() {
            state.inputBuffer = "";
            document.getElementById('input-display').innerText = "0";
        }

        function submitScore() {
            if (state.inputBuffer === "") return;
            const points = parseInt(state.inputBuffer);
            if (isNaN(points)) return;

            // Állapot mentés visszavonáshoz
            state.history.push(JSON.parse(JSON.stringify(state)));

            const currentScore = state.scores[state.activePlayer];
            let newScore = currentScore - points;
            let isBust = false;

            if (newScore < 0) {
                isBust = true;
            } else if (newScore === 0) {
                if (state.checkoutType === "DO") {
                    // Egyszerűsített feltétel: ha 0-ra érkezik, feltételezzük a duplát vagy kérdezünk
                    // A felhasználói élmény miatt itt elfogadjuk a kiszállást
                }
            } else if (newScore === 1 && state.checkoutType === "DO") {
                isBust = true; // 1-re nem lehet duplával kiszállni
            }

            if (isBust) {
                alert("Besokallás! (Bust)");
                state.inputBuffer = "";
                document.getElementById('input-display').innerText = "0";
                state.activePlayer = 1 - state.activePlayer;
                saveState();
                updateUI();
                return;
            }

            // Statisztika frissítés
            state.stats[state.activePlayer].darts += 3;
            state.stats[state.activePlayer].totalScore += points;

            state.scores[state.activePlayer] = newScore;
            state.inputBuffer = "";
            document.getElementById('input-display').innerText = "0";

            if (newScore === 0) {
                alert(`Gratulálok, ${state.names[state.activePlayer]} megnyerte a leget! 🎉`);
                resetMatch();
                return;
            }

            state.activePlayer = 1 - state.activePlayer;
            saveState();
            updateUI();
        }

        function undoScore() {
            if (state.history.length === 0) return;
            state = state.history.pop();
            saveState();
            updateUI();
            clearInput();
        }

        function updateUI() {
            document.getElementById('score-0').innerText = state.scores[0];
            document.getElementById('score-1').innerText = state.scores[1];
            document.getElementById('name-0').innerText = state.names[0];
            document.getElementById('name-1').innerText = state.names[1];

            document.getElementById('card-0').className = `player-card ${state.activePlayer === 0 ? 'active' : ''}`;
            document.getElementById('card-1').className = `player-card ${state.activePlayer === 1 ? 'active' : ''}`;

            document.getElementById('header-title').innerText = `${state.startScore} ${state.checkoutType}`;

            // Átlagok számítása
            for(let i=0; i<2; i++) {
                const s = state.stats[i];
                const avg = s.darts > 0 ? ((s.totalScore / s.darts) * 3).toFixed(1) : "0.0";
                document.getElementById(`avg-${i}`).innerText = avg;
            }

            // Kiszálló javaslat
            const currScore = state.scores[state.activePlayer];
            const checkoutEl = document.getElementById('checkout-text');
            if (currScore <= 170 && checkouts[currScore]) {
                checkoutEl.innerText = checkouts[currScore];
            } else {
                checkoutEl.innerText = "-";
            }
        }

        function renamePlayer(idx) {
            const newName = prompt(`Add meg a(z) ${idx + 1}. játékos nevét:`, state.names[idx]);
            if (newName && newName.trim() !== "") {
                state.names[idx] = newName.trim();
                saveState();
                updateUI();
            }
        }

        function openSettings() {
            document.getElementById('setting-startscore').value = state.startScore;
            document.getElementById('setting-checkout').value = state.checkoutType;
            document.getElementById('settings-modal').classList.add('open');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('open');
        }

        function saveSettings() {
            state.startScore = parseInt(document.getElementById('setting-startscore').value);
            state.checkoutType = document.getElementById('setting-checkout').value;
            resetMatch();
            closeSettings();
        }

        function resetMatch() {
            state.scores = [state.startScore, state.startScore];
            state.activePlayer = 0;
            state.inputBuffer = "";
            state.history = [];
            state.stats = [{ darts: 0, totalScore: 0 }, { darts: 0, totalScore: 0 }];
            saveState();
            updateUI();
            clearInput();
        }

        window.onload = init;
    </script>
</body>
</html>
